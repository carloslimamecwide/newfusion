services:
  web:
    image: ghcr.io/carloslimamecwide/newfusion:${TAG:-latest}
    container_name: webfusionlab-web
    restart: unless-stopped
    env_file: .env
    networks:
      - apps
      - data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  apps:
    external: true
  data:
    external: true
